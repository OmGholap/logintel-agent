[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logintel"
version = "0.1.0"
description = "A read-only agent that answers questions about logs and cites the real lines."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain-openai>=1.6",
    "pydantic>=2.13",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
logintel = "logintel.cli:main"

[tool.setuptools.packages.find]
include = ["logintel*"]
